<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <title>Contatos</title>
</head>
<body>
    <nav>
        <a class="logo" href="../index.html">
            <img src="../galeria/icon.png" alt="Home">
        </a>
        <div class="links">
            <a class="ativo" href="../index.html">Home</a>
            <a href="detalhes.html">Detalhes</a>
            <a href="contatos.html">Contatos</a>
        </div>
    </nav>
    <div class="container">
        <div class="centralizado">
            <div class="contato">
                <h1>CONTATOS</h1>
                <p>Entre em contato com a organização:</p>
            </div>
            <div class="formulario">
                <form>
                    <div class="campo">
                    <label for="nome">Nome:</label><br>
                    <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="campo">
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" required>
                    </div>
                    <div class="campo">
                    <label for="assunto">Assunto:</label><br>
                    <input type="text" id="assunto" name="assunto" required>
                    </div>
                    <div class="campo">
                    <label for="mensagem">Mensagem:</label><br>
                    <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
                    </div>
                    <div class="campo">
                        <button class="button" type="submit">Enviar</button>
                    </div>
                </form>
            </div>
            <div class="informacoes">
                <h2>Informações</h2>
                <p>E-mail: <a href="mailto:contato@communitycup.com">contato@communitycup.com</a></p>
                <p>Telefone: <a href="tel:+5511999999999">(11) 99999-9999</a></p>
            </div>
            <div class="redessociais">
                <h2>Nossas Redes sociais</h2>
                <p>
                    <a href="https://www.twitch.tv/dbdleague" >Twitch</a> |
                    <a href="https://www.youtube.com/@dbdleague">YouTube</a> |
                    <a href="https://x.com/DBDLeague" >Twitter</a>
                </p>
            </div> <br><br><br><br>
        </div>
    </div>
</body>
</html>
